<svg class="service-art-svg" viewBox="0 0 340 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric heat exposure scan and building vulnerability audit illustration">
  <defs>
    <!-- Dark technical canvas grid -->
    <pattern id="c1-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1d4d3d" stroke-width="0.75" stroke-dasharray="1 3"/>
    </pattern>
    <!-- Thermal heatmap gradient -->
    <radialGradient id="c1-heat-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="c1-facade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#1e5441"/>
    </linearGradient>
    <filter id="c1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Technical Canvas Base -->
  <rect width="100%" height="100%" rx="12" fill="#13382c"/>
  <rect width="100%" height="100%" rx="12" fill="url(#c1-grid)"/>

  <!-- Top Minimal Tag -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="102" height="18" rx="9" fill="#1d4d3d" stroke="#2b6b54" stroke-width="1"/>
    <circle cx="9" cy="9" r="3.5" fill="#ef4444"/>
    <text x="18" y="12.5" fill="#f5f6e9" font-family="'DM Sans',sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.8">THERMAL SCAN</text>
  </g>

  <!-- Sun Angle & Direct Radiation Vector (Top Right) -->
  <g transform="translate(290, 22)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
    <!-- Solar Rays -->
    <line x1="0" y1="-12" x2="0" y2="-15" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="11" y2="-11" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="15" y2="0" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Solar ray pointing toward roof -->
    <path d="M -10 10 L -60 42" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3 3"/>
    <polygon points="-63,44 -54,39 -56,48" fill="#f97316"/>
  </g>

  <!-- Ground Plane / Footprint (Isometric) -->
  <polygon points="40,120 170,70 300,106 170,154" fill="#184335" stroke="#25644e" stroke-width="1"/>
  <!-- Ground Shadow -->
  <polygon points="65,128 170,80 255,110 140,150" fill="#0d281f" opacity="0.6"/>

  <!-- ================= ISOMETRIC COMMERCIAL BUILDING ================= -->
  <!-- Southwest Facade (Sun-exposed, severe thermal absorption) -->
  <polygon points="90,130 175,100 175,54 90,84" fill="url(#c1-facade-grad)" stroke="#103d30" stroke-width="1.2"/>
  <!-- Facade Sensor Points -->
  <circle cx="115" cy="104" r="2.5" fill="#ef4444"/>
  <circle cx="145" cy="88" r="2.5" fill="#f97316"/>
  <circle cx="125" cy="118" r="2.5" fill="#eab308"/>
  <circle cx="155" cy="102" r="2.5" fill="#ef4444"/>

  <!-- Southeast Facade (Partially shaded / lower thermal stress) -->
  <polygon points="175,100 245,76 245,30 175,54" fill="#1b4d3c" stroke="#103d30" stroke-width="1.2"/>
  <line x1="198" y1="92" x2="198" y2="46" stroke="#25644e" stroke-width="1"/>
  <line x1="222" y1="84" x2="222" y2="38" stroke="#25644e" stroke-width="1"/>

  <!-- Unshaded Flat Roof (Vulnerability Hotspot) -->
  <polygon points="90,84 175,54 245,30 160,60" fill="#1b4335" stroke="#103d30" stroke-width="1.2"/>
  
  <!-- Heat Map Glow Overlay on Roof -->
  <polygon points="96,82 172,56 238,34 161,60" fill="url(#c1-heat-radial)" opacity="0.9" filter="url(#c1-glow)"/>
  
  <!-- Isothermal Contour Isolines -->
  <path d="M125 74 Q165 53 205 39" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M142 69 Q172 55 195 45" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Targeting Reticle / Vulnerability Callout -->
  <g transform="translate(172, 55)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="0" cy="0" r="3" fill="#ef4444"/>
    <line x1="-18" y1="0" x2="-6" y2="0" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="6" y1="0" x2="18" y2="0" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="0" y1="-18" x2="0" y2="-6" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="0" y1="6" x2="0" y2="18" stroke="#ef4444" stroke-width="1.2"/>
  </g>

  <!-- Clear Minimal Hotspot Badge (Well above the roof, clean and uncrowded) -->
  <g transform="translate(196, 34)">
    <rect x="0" y="0" width="70" height="18" rx="4" fill="#0d281f" stroke="#ef4444" stroke-width="1"/>
    <text x="35" y="12.5" fill="#fca5a5" font-family="'DM Sans',sans-serif" font-size="8" font-weight="800" text-anchor="middle">38.5°C ⚠</text>
  </g>

  <!-- Shaded Microclimate Indicator (Left Ground) -->
  <g transform="translate(36, 134)">
    <rect x="0" y="0" width="68" height="17" rx="4" fill="#0d281f" stroke="#10b981" stroke-width="1"/>
    <circle cx="9" cy="8.5" r="3" fill="#10b981"/>
    <text x="38" y="11.5" fill="#6ee7b7" font-family="'DM Sans',sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">24.1°C</text>
  </g>

  <!-- Thermal Scale Bar (Bottom Right, Clean & Uncluttered) -->
  <g transform="translate(225, 140)">
    <rect x="0" y="0" width="98" height="14" rx="3" fill="#0d281f" stroke="#25644e" stroke-width="0.8"/>
    <text x="6" y="10" fill="#a7f3d0" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="700">22°</text>
    <rect x="22" y="4" width="10" height="6" fill="#10b981"/>
    <rect x="32" y="4" width="10" height="6" fill="#84cc16"/>
    <rect x="42" y="4" width="10" height="6" fill="#facc15"/>
    <rect x="52" y="4" width="10" height="6" fill="#f97316"/>
    <rect x="62" y="4" width="10" height="6" fill="#ef4444"/>
    <text x="80" y="10" fill="#fca5a5" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="700">40°C</text>
  </g>
</svg>