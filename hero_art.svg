<svg class="city-art" viewBox="0 0 620 500" role="img" aria-label="Architectural infographic of climate-resilient commercial building with green roofs, solar shading, living facade, and bioswales" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky & atmospheric gradients -->
    <linearGradient id="hero-sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf8f4"/>
      <stop offset="60%" stop-color="#cdeee3"/>
      <stop offset="100%" stop-color="#b6e5d6"/>
    </linearGradient>
    <linearGradient id="green-roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72b34a"/>
      <stop offset="50%" stop-color="#55993b"/>
      <stop offset="100%" stop-color="#366b28"/>
    </linearGradient>
    <linearGradient id="living-facade-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d8f37"/>
      <stop offset="100%" stop-color="#1f5127"/>
    </linearGradient>
    <linearGradient id="solar-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f7f0"/>
      <stop offset="100%" stop-color="#b5e3d7"/>
    </linearGradient>
    <linearGradient id="pv-panel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3b33"/>
      <stop offset="60%" stop-color="#2d5c50"/>
      <stop offset="100%" stop-color="#3d7567"/>
    </linearGradient>
    <pattern id="permeable-paving" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0 L16 8 L8 16 Z" fill="#edeade" stroke="#174d3b" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="8" cy="8" r="1.5" fill="#84cc16" opacity="0.6"/>
    </pattern>
    <pattern id="blueprint-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#174d3b" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#174d3b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Architectural Background Grid -->
  <rect x="0" y="0" width="620" height="500" fill="url(#hero-sky-grad)"/>
  <rect x="0" y="0" width="620" height="420" fill="url(#blueprint-grid)" opacity="0.7"/>

  <!-- Topography Contours & Hills -->
  <path d="M0 310 Q140 250 280 295 T520 275 T620 290 V500 H0 Z" fill="#84cc16" opacity="0.25"/>
  <path d="M0 365 Q160 310 320 345 T560 325 T620 340 V500 H0 Z" fill="#286752" opacity="0.2"/>

  <!-- Ground Plane: Permeable Paving Promenade -->
  <polygon points="40,395 330,270 580,335 310,475" fill="url(#permeable-paving)"/>
  <polygon points="40,395 330,270 580,335 310,475" fill="none" stroke="#174d3b" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Bioswale & Rain Garden Drainage Zone -->
  <path d="M40 405 Q120 425 210 415 T360 455 L320 480 Q180 445 40 435 Z" fill="#3b7a57" opacity="0.85"/>
  <path d="M60 415 Q130 430 200 422 T340 460" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Underground Rainwater Harvesting Retention Tank Indicator -->
  <g transform="translate(140, 435)">
    <rect x="0" y="0" width="85" height="30" rx="4" fill="#1b4d3e" stroke="#5eead4" stroke-width="1" opacity="0.9"/>
    <text x="42" y="14" fill="#a7f3d0" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">RAIN RETENTION</text>
    <text x="42" y="24" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="7" font-weight="800" text-anchor="middle">85 L/m² BUFFER</text>
    <path d="M15 30 V38 H70 V30" fill="none" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 2"/>
  </g>

  <!-- ================= COMMERCIAL BUILDING COMPLEX ================= -->
  <!-- Shadow under building -->
  <polygon points="120,380 340,265 520,315 310,440" fill="#173d30" opacity="0.18" filter="url(#soft-shadow)"/>

  <!-- Main Tower: 4-Tier Stepped Climate-Resilient Architecture -->
  <g id="main-building" stroke="#174d3b" stroke-width="1.5" stroke-linejoin="round">
    
    <!-- Base podium: Floor 1 & 2 -->
    <!-- Left facade (Southwest - Sun exposed with vertical green wall) -->
    <polygon points="140,370 280,295 280,210 140,285" fill="#f4f3ea"/>
    <!-- Glazed entrance and spandrels -->
    <polygon points="155,360 265,302 265,265 155,320" fill="url(#solar-glass-grad)"/>
    <!-- Brise-soleil architectural louvers -->
    <line x1="155" y1="330" x2="265" y2="272" stroke="#174d3b" stroke-width="2"/>
    <line x1="155" y1="342" x2="265" y2="284" stroke="#174d3b" stroke-width="2"/>
    <line x1="155" y1="354" x2="265" y2="296" stroke="#174d3b" stroke-width="2"/>

    <!-- Living Facade Cable Trellis on Southwest Corner -->
    <g id="green-wall">
      <polygon points="140,285 185,260 185,345 140,370" fill="url(#living-facade-grad)"/>
      <!-- Trellis wire pattern -->
      <line x1="140" y1="305" x2="185" y2="280" stroke="#84cc16" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="140" y1="325" x2="185" y2="300" stroke="#84cc16" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="140" y1="345" x2="185" y2="320" stroke="#84cc16" stroke-width="1" stroke-dasharray="2 2"/>
      <!-- Foliage clusters on wall -->
      <circle cx="150" cy="300" r="8" fill="#387739" stroke="none"/>
      <circle cx="165" cy="285" r="7" fill="#65a83e" stroke="none"/>
      <circle cx="175" cy="315" r="9" fill="#2d6032" stroke="none"/>
      <circle cx="155" cy="335" r="8" fill="#529938" stroke="none"/>
      <circle cx="170" cy="340" r="6" fill="#84cc16" stroke="none"/>
    </g>

    <!-- Right facade (Southeast - Glazed Curtain Wall) -->
    <polygon points="280,295 440,230 440,145 280,210" fill="#eae8dc"/>
    <!-- Glazing bays & mullions -->
    <g fill="url(#solar-glass-grad)">
      <polygon points="295,284 355,259 355,225 295,250"/>
      <polygon points="370,253 425,230 425,196 370,219"/>
      <polygon points="295,242 355,217 355,185 295,210"/>
      <polygon points="370,211 425,188 425,156 370,179"/>
    </g>
    <!-- Floor division slab bands -->
    <line x1="280" y1="250" x2="440" y2="185" stroke="#174d3b" stroke-width="2.5"/>

    <!-- Mid-level Terrace (Stepped Intensive Green Roof) -->
    <!-- Roof slab -->
    <polygon points="240,205 380,145 440,170 300,230" fill="url(#green-roof-grad)"/>
    <polygon points="240,205 380,145 440,170 300,230" fill="none" stroke="#286752" stroke-width="2"/>
    <!-- Planter parapet edge -->
    <polygon points="237,203 297,228 300,230 240,205" fill="#84cc16"/>
    <!-- Sedum shrubs & rooftop flora -->
    <g fill="#286752">
      <ellipse cx="270" cy="210" rx="9" ry="5"/>
      <ellipse cx="320" cy="190" rx="14" ry="7" fill="#4d8f37"/>
      <ellipse cx="360" cy="170" rx="12" ry="6" fill="#72b34a"/>
      <ellipse cx="400" cy="165" rx="10" ry="5" fill="#2d6032"/>
      <ellipse cx="340" cy="205" rx="11" ry="6" fill="#84cc16"/>
    </g>
    <!-- Outdoor collaborative pergola / wooden deck -->
    <polygon points="330,175 370,158 395,170 355,187" fill="#dfcca5"/>
    <line x1="335" y1="173" x2="335" y2="160" stroke="#174d3b" stroke-width="1.5"/>
    <line x1="370" y1="158" x2="370" y2="145" stroke="#174d3b" stroke-width="1.5"/>
    <line x1="395" y1="170" x2="395" y2="157" stroke="#174d3b" stroke-width="1.5"/>
    <line x1="355" y1="187" x2="355" y2="174" stroke="#174d3b" stroke-width="1.5"/>
    <polygon points="335,160 370,145 395,157 355,172" fill="#84cc16" opacity="0.6"/>

    <!-- Upper Tower: Penthouse & Bio-Solar Roof -->
    <polygon points="200,205 280,165 280,105 200,145" fill="#f8f7f0"/>
    <polygon points="280,165 370,125 370,65 280,105" fill="#edeade"/>
    <!-- High-efficiency curtain wall glazing -->
    <polygon points="212,195 270,166 270,135 212,164" fill="url(#solar-glass-grad)"/>
    <polygon points="288,158 358,127 358,96 288,127" fill="url(#solar-glass-grad)"/>

    <!-- Top Roof: Intensive Sedum Roof with Solar PV Canopy -->
    <polygon points="200,105 280,65 370,105 290,145" fill="url(#green-roof-grad)"/>
    
    <!-- Elevated Bifacial Solar PV Canopy Array -->
    <g id="solar-pv-canopy">
      <!-- Stanchions -->
      <line x1="225" y1="102" x2="225" y2="82" stroke="#174d3b" stroke-width="2"/>
      <line x1="285" y1="72" x2="285" y2="52" stroke="#174d3b" stroke-width="2"/>
      <line x1="345" y1="97" x2="345" y2="77" stroke="#174d3b" stroke-width="2"/>
      <line x1="285" y1="127" x2="285" y2="107" stroke="#174d3b" stroke-width="2"/>
      <!-- PV Array Plane tilted to optimal solar angle -->
      <polygon points="220,80 285,50 350,75 285,105" fill="url(#pv-panel-grad)"/>
      <polygon points="220,80 285,50 350,75 285,105" fill="none" stroke="#84cc16" stroke-width="1.2"/>
      <!-- Grid cells on PV panels -->
      <line x1="252" y1="65" x2="317" y2="90" stroke="#a7f3d0" stroke-width="0.8" opacity="0.6"/>
      <line x1="252" y1="92" x2="317" y2="62" stroke="#a7f3d0" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Secondary East Pavilion (Cool High-Albedo Roof) -->
    <polygon points="410,230 490,195 490,285 410,320" fill="#f0efe4"/>
    <polygon points="490,195 540,215 540,305 490,285" fill="#dedbd0"/>
    <polygon points="410,230 490,195 540,215 460,250" fill="#fbfbfa"/>
    <polygon points="410,230 490,195 540,215 460,250" fill="none" stroke="#286752" stroke-width="1.5"/>
    <text x="475" y="228" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="6" font-weight="800" text-anchor="middle">COOL ROOF · ALBEDO 0.85</text>
  </g>

  <!-- ================= MATURE URBAN SHADE TREES ================= -->
  <!-- Tree 1: Promenade canopy (Left) -->
  <g id="tree-left" stroke="#174d3b" stroke-width="1.5">
    <!-- Tree Trunk -->
    <path d="M75 425 Q70 380 65 350 Q60 380 55 425" fill="#5a3d28"/>
    <!-- Tree Shadow ellipse -->
    <ellipse cx="65" cy="425" rx="35" ry="12" fill="#173d30" opacity="0.25" stroke="none"/>
    <!-- Multi-layered isometric deciduous foliage -->
    <circle cx="50" cy="340" r="28" fill="#174d3b"/>
    <circle cx="75" cy="330" r="32" fill="#286752"/>
    <circle cx="55" cy="305" r="26" fill="#3b8253"/>
    <circle cx="80" cy="310" r="22" fill="#529938"/>
    <circle cx="65" cy="290" r="20" fill="#84cc16"/>
  </g>

  <!-- Tree 2: Courtyard Canopy (Center Right) -->
  <g id="tree-right" stroke="#174d3b" stroke-width="1.5">
    <ellipse cx="490" cy="375" rx="45" ry="15" fill="#173d30" opacity="0.25" stroke="none"/>
    <path d="M495 375 Q490 330 488 295 Q482 330 478 375" fill="#5a3d28"/>
    <circle cx="470" cy="285" r="30" fill="#174d3b"/>
    <circle cx="505" cy="275" r="35" fill="#286752"/>
    <circle cx="480" cy="250" r="28" fill="#4d8f37"/>
    <circle cx="515" cy="255" r="24" fill="#72b34a"/>
    <circle cx="495" cy="235" r="20" fill="#c7f36a"/>
  </g>

  <!-- Shaded Courtyard Bench & Pedestrians -->
  <rect x="440" y="365" width="28" height="6" rx="2" fill="#174d3b"/>
  <line x1="444" y1="371" x2="444" y2="378" stroke="#174d3b" stroke-width="2"/>
  <line x1="464" y1="371" x2="464" y2="378" stroke="#174d3b" stroke-width="2"/>

  <!-- ================= ARCHITECTURAL INFOGRAPHIC & THERMAL FLOW CALLOUTS ================= -->
  
  <!-- Cool Airflow Microclimate Vector Arrows -->
  <g id="airflow-arrows" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round">
    <!-- Path 1: Breeze through courtyard -->
    <path d="M570 380 Q480 340 370 380 T200 400" stroke-dasharray="6 4"/>
    <polygon points="196,400 206,394 204,405" fill="#0d9488" stroke="none"/>

    <!-- Path 2: Natural cross ventilation rising over green roof -->
    <path d="M120 320 Q160 250 230 190 T350 130" stroke="#14b8a6" stroke-width="2" stroke-dasharray="5 3"/>
    <polygon points="355,127 344,129 349,137" fill="#14b8a6" stroke="none"/>
  </g>

  <!-- Solar Heat Deflection Rays from Roof -->
  <g id="solar-deflection" stroke="#eab308" stroke-width="1.8" stroke-linecap="round">
    <line x1="285" y1="45" x2="265" y2="20" stroke-dasharray="3 3"/>
    <polygon points="263,18 266,26 272,21" fill="#eab308" stroke="none"/>
    <line x1="315" y1="55" x2="335" y2="25" stroke-dasharray="3 3"/>
    <polygon points="337,23 329,26 335,32" fill="#eab308" stroke="none"/>
  </g>

  <!-- Technical Callout Badges with Leader Lines -->
  <!-- Callout 1: Intensive Green Roof -->
  <g transform="translate(390, 80)">
    <line x1="-20" y1="45" x2="15" y2="12" stroke="#174d3b" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="-20" cy="45" r="2.5" fill="#84cc16" stroke="#174d3b"/>
    <rect x="15" y="0" width="125" height="26" rx="5" fill="#f7f6ed" stroke="#174d3b" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="27" cy="13" r="5" fill="#84cc16"/>
    <text x="38" y="11" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="7.5" font-weight="800">GREEN ROOF TERRACE</text>
    <text x="38" y="20" fill="#527969" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="600">-4.5°C SURFACE TEMP</text>
  </g>

  <!-- Callout 2: Vertical Living Facade -->
  <g transform="translate(30, 230)">
    <line x1="110" y1="50" x2="80" y2="25" stroke="#174d3b" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="110" cy="50" r="2.5" fill="#84cc16" stroke="#174d3b"/>
    <rect x="-10" y="10" width="120" height="26" rx="5" fill="#f7f6ed" stroke="#174d3b" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="2" cy="23" r="5" fill="#174d3b"/>
    <text x="13" y="21" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="7.5" font-weight="800">LIVING GREEN FACADE</text>
    <text x="13" y="30" fill="#527969" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="600">SOLAR SHADING BUFFER</text>
  </g>

  <!-- Callout 3: Permeable Paving & Bioswale -->
  <g transform="translate(360, 380)">
    <line x1="-50" y1="15" x2="-10" y2="0" stroke="#174d3b" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="-50" cy="15" r="2.5" fill="#5eead4" stroke="#174d3b"/>
    <rect x="-10" y="-12" width="138" height="26" rx="5" fill="#174d3b" stroke="#84cc16" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <circle cx="3" cy="1" r="5" fill="#5eead4"/>
    <text x="15" y="-1" fill="#ffffff" font-family="'DM Sans',sans-serif" font-size="7.5" font-weight="800">PERMEABLE PLAZA</text>
    <text x="15" y="8" fill="#a7f3d0" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="600">NATURAL RAIN INFILTRATION</text>
  </g>

  <!-- Technical Axis Coordinate Ticks -->
  <g stroke="#174d3b" stroke-width="1" opacity="0.4">
    <line x1="20" y1="475" x2="35" y2="475"/>
    <line x1="20" y1="460" x2="20" y2="475"/>
    <text x="40" y="478" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="700">COORD: 52°22'N · CLIMATE ZONE 04</text>
  </g>
</svg>