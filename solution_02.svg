<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Urban public park with mature shade trees, pedestrian walkway, seating, and shaded green spaces">
  <defs>
    <linearGradient id="s2-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7f0e3"/>
      <stop offset="60%" stop-color="#c3e9d8"/>
      <stop offset="100%" stop-color="#b0dfc9"/>
    </linearGradient>
    <linearGradient id="s2-ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9dcc8a"/>
      <stop offset="100%" stop-color="#7aaf6a"/>
    </linearGradient>
    <linearGradient id="s2-path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2f0e4"/>
      <stop offset="50%" stop-color="#ededdf"/>
      <stop offset="100%" stop-color="#e5e3d5"/>
    </linearGradient>
    <linearGradient id="s2-bldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f2e6"/>
      <stop offset="100%" stop-color="#e5e3d5"/>
    </linearGradient>
    <radialGradient id="s2-sunhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#fcd34d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="s2-shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#103d30" flood-opacity="0.12"/>
    </filter>
    <clipPath id="s2-clip">
      <rect width="380" height="240" rx="0"/>
    </clipPath>
  </defs>

  <!-- Sky background -->
  <rect width="380" height="240" fill="url(#s2-sky)"/>

  <!-- Sun halo (upper left) -->
  <circle cx="52" cy="42" r="42" fill="url(#s2-sunhalo)"/>
  <circle cx="52" cy="42" r="18" fill="#facc15" opacity="0.45"/>
  <circle cx="52" cy="42" r="9" fill="#f59e0b" opacity="0.9"/>

  <!-- Sunlight shafts through canopy (angled from top-left) -->
  <g opacity="0.13" stroke="#fbbf24" stroke-width="14" stroke-linecap="round">
    <line x1="60" y1="10" x2="145" y2="145"/>
    <line x1="95" y1="5" x2="185" y2="148"/>
    <line x1="128" y1="0" x2="220" y2="140"/>
  </g>

  <!-- ===== BACKGROUND: URBAN BUILDING BLOCK ===== -->
  <!-- Main building body -->
  <rect x="240" y="45" width="115" height="140" rx="3" fill="url(#s2-bldg)" stroke="#174d3b" stroke-width="1.2"/>
  <!-- Floor bands -->
  <line x1="240" y1="95" x2="355" y2="95" stroke="#174d3b" stroke-width="1"/>
  <line x1="240" y1="140" x2="355" y2="140" stroke="#174d3b" stroke-width="1"/>
  <!-- Glazing bays floor 1 -->
  <rect x="248" y="53" width="30" height="34" rx="2" fill="#bde8d6"/>
  <rect x="285" y="53" width="30" height="34" rx="2" fill="#bde8d6"/>
  <rect x="322" y="53" width="26" height="34" rx="2" fill="#bde8d6"/>
  <!-- Glazing bays floor 2 -->
  <rect x="248" y="103" width="30" height="30" rx="2" fill="#d4edd5"/>
  <rect x="285" y="103" width="30" height="30" rx="2" fill="#d4edd5"/>
  <rect x="322" y="103" width="26" height="30" rx="2" fill="#d4edd5"/>
  <!-- Glazing bays floor 3 -->
  <rect x="248" y="148" width="30" height="28" rx="2" fill="#cde8d9"/>
  <rect x="285" y="148" width="30" height="28" rx="2" fill="#cde8d9"/>
  <rect x="322" y="148" width="26" height="28" rx="2" fill="#cde8d9"/>
  <!-- Building rooftop parapet + subtle green roof -->
  <rect x="240" y="35" width="115" height="12" fill="#84cc16" opacity="0.6" rx="2"/>
  <rect x="240" y="35" width="115" height="12" fill="none" stroke="#174d3b" stroke-width="1"/>
  <!-- Small planted pots on windowsills -->
  <g fill="#286752">
    <rect x="252" y="85" width="6" height="6" rx="1"/>
    <rect x="289" y="85" width="6" height="6" rx="1"/>
    <rect x="252" y="131" width="6" height="6" rx="1"/>
    <rect x="289" y="131" width="6" height="6" rx="1"/>
  </g>

  <!-- ===== GROUND PLANE: LAWN & SOFT LANDSCAPE ===== -->
  <!-- Lawn base -->
  <rect x="0" y="175" width="380" height="65" fill="url(#s2-ground)"/>
  <!-- Planted lawn beds flanking the path -->
  <ellipse cx="80" cy="177" rx="68" ry="18" fill="#86c87a"/>
  <ellipse cx="300" cy="178" rx="65" ry="17" fill="#86c87a"/>
  <!-- Subtle ground turf texture lines -->
  <g stroke="#4d8e3e" stroke-width="0.7" opacity="0.4">
    <line x1="10" y1="192" x2="35" y2="192"/>
    <line x1="42" y1="196" x2="65" y2="196"/>
    <line x1="70" y1="192" x2="95" y2="192"/>
    <line x1="285" y1="192" x2="310" y2="192"/>
    <line x1="316" y1="196" x2="340" y2="196"/>
    <line x1="345" y1="191" x2="368" y2="191"/>
  </g>

  <!-- ===== PEDESTRIAN WALKWAY / PROMENADE ===== -->
  <!-- Path body -->
  <polygon points="115,176 265,176 280,240 100,240" fill="url(#s2-path)" stroke="#b8b3a0" stroke-width="0.8"/>
  <!-- Path centre line  -->
  <line x1="190" y1="177" x2="190" y2="240" stroke="#c9c4b0" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- Embedded paving edge stones -->
  <rect x="115" y="176" width="150" height="4" fill="#dddac9" stroke="#b8b3a0" stroke-width="0.6"/>

  <!-- ===== PUBLIC SEATING (BENCH PAIR) ===== -->
  <g transform="translate(155, 196)">
    <!-- Left bench -->
    <rect x="-30" y="0" width="26" height="5" rx="1.5" fill="#174d3b"/>
    <rect x="-27" y="5" width="4" height="8" rx="1" fill="#5a3d28"/>
    <rect x="-11" y="5" width="4" height="8" rx="1" fill="#5a3d28"/>
    <!-- Right bench -->
    <rect x="5" y="0" width="26" height="5" rx="1.5" fill="#174d3b"/>
    <rect x="8" y="5" width="4" height="8" rx="1" fill="#5a3d28"/>
    <rect x="23" y="5" width="4" height="8" rx="1" fill="#5a3d28"/>
  </g>

  <!-- ===== SMALL PLANTED BEDS BESIDE WALKWAY ===== -->
  <!-- Left planter strip -->
  <rect x="85" y="180" width="30" height="14" rx="4" fill="#286752" opacity="0.35" stroke="#174d3b" stroke-width="0.8"/>
  <circle cx="93" cy="185" r="4" fill="#84cc16"/>
  <circle cx="103" cy="183" r="5" fill="#529938"/>
  <circle cx="112" cy="186" r="3.5" fill="#84cc16"/>
  <!-- Right planter strip -->
  <rect x="265" y="180" width="30" height="14" rx="4" fill="#286752" opacity="0.35" stroke="#174d3b" stroke-width="0.8"/>
  <circle cx="273" cy="185" r="4" fill="#84cc16"/>
  <circle cx="282" cy="183" r="5" fill="#529938"/>
  <circle cx="291" cy="186" r="3.5" fill="#84cc16"/>

  <!-- ===== MATURE SHADE TREES (HERO ELEMENTS) ===== -->
  <!-- TREE A — Large mature tree (far left) -->
  <g transform="translate(60, 182)" filter="url(#s2-shadow)">
    <!-- Root ground shadow -->
    <ellipse cx="3" cy="4" rx="30" ry="11" fill="#173d30" opacity="0.22" stroke="none"/>
    <!-- Trunk -->
    <path d="M -3 0 Q -6 -28 -5 -58 Q -1 -28 2 0" fill="#5a3d28" stroke="#3d2a1e" stroke-width="0.7"/>
    <!-- Canopy — layered spheres for depth -->
    <circle cx="-14" cy="-65" r="22" fill="#174d3b" stroke="#174d3b" stroke-width="0.6"/>
    <circle cx="8" cy="-72" r="28" fill="#286752" stroke="#174d3b" stroke-width="0.6"/>
    <circle cx="-6" cy="-88" r="22" fill="#3b8253" stroke="#174d3b" stroke-width="0.6"/>
    <circle cx="12" cy="-92" r="18" fill="#529938" stroke="#174d3b" stroke-width="0.6"/>
    <circle cx="0" cy="-104" r="14" fill="#84cc16" stroke="#174d3b" stroke-width="0.6"/>
    <!-- Dappled shade patch cast on ground -->
    <ellipse cx="25" cy="8" rx="32" ry="12" fill="#4d8e3e" opacity="0.3"/>
  </g>

  <!-- TREE B — Tall tree (centre-left of path) -->
  <g transform="translate(125, 178)" filter="url(#s2-shadow)">
    <ellipse cx="2" cy="3" rx="20" ry="8" fill="#173d30" opacity="0.2" stroke="none"/>
    <path d="M -2 0 Q -4 -22 -3 -46 Q 0 -22 2 0" fill="#5a3d28" stroke="#3d2a1e" stroke-width="0.7"/>
    <circle cx="-8" cy="-52" r="18" fill="#174d3b"/>
    <circle cx="6" cy="-58" r="22" fill="#286752"/>
    <circle cx="-2" cy="-73" r="18" fill="#4d8f37"/>
    <circle cx="8" cy="-77" r="14" fill="#72b34a"/>
    <circle cx="-1" cy="-87" r="11" fill="#84cc16"/>
    <!-- Dappled shade cast -->
    <ellipse cx="18" cy="6" rx="22" ry="9" fill="#4d8e3e" opacity="0.28"/>
  </g>

  <!-- TREE C — Tall tree (centre-right of path) -->
  <g transform="translate(252, 178)" filter="url(#s2-shadow)">
    <ellipse cx="-2" cy="3" rx="20" ry="8" fill="#173d30" opacity="0.2" stroke="none"/>
    <path d="M -2 0 Q -4 -22 -3 -46 Q 0 -22 2 0" fill="#5a3d28" stroke="#3d2a1e" stroke-width="0.7"/>
    <circle cx="-8" cy="-52" r="18" fill="#174d3b"/>
    <circle cx="6" cy="-58" r="22" fill="#286752"/>
    <circle cx="-2" cy="-73" r="18" fill="#4d8f37"/>
    <circle cx="8" cy="-77" r="14" fill="#72b34a"/>
    <circle cx="-1" cy="-87" r="11" fill="#84cc16"/>
    <ellipse cx="-18" cy="6" rx="22" ry="9" fill="#4d8e3e" opacity="0.28"/>
  </g>

  <!-- TREE D — Large mature tree (far right) -->
  <g transform="translate(322, 182)" filter="url(#s2-shadow)">
    <ellipse cx="-3" cy="4" rx="28" ry="11" fill="#173d30" opacity="0.22" stroke="none"/>
    <path d="M -2 0 Q -4 -26 -4 -54 Q 0 -26 2 0" fill="#5a3d28" stroke="#3d2a1e" stroke-width="0.7"/>
    <circle cx="-12" cy="-62" r="21" fill="#174d3b"/>
    <circle cx="6" cy="-68" r="26" fill="#286752"/>
    <circle cx="-4" cy="-84" r="21" fill="#3b8253"/>
    <circle cx="9" cy="-88" r="17" fill="#529938"/>
    <circle cx="-1" cy="-100" r="14" fill="#84cc16"/>
    <ellipse cx="-22" cy="8" rx="28" ry="11" fill="#4d8e3e" opacity="0.28"/>
  </g>

  <!-- ===== COMBINED SHADE POOLS ON GROUND (soft overlap) ===== -->
  <ellipse cx="130" cy="200" rx="55" ry="20" fill="#2d6032" opacity="0.18"/>
  <ellipse cx="252" cy="200" rx="55" ry="20" fill="#2d6032" opacity="0.18"/>

  <!-- ===== AMBIENT DETAILS: BIRDS & BUTTERFLIES ===== -->
  <!-- Birds in flight (silhouette, top) -->
  <g fill="none" stroke="#286752" stroke-width="1.2" stroke-linecap="round">
    <path d="M 172 30 Q 177 27 182 30"/>
    <path d="M 186 22 Q 191 19 196 22"/>
    <path d="M 160 36 Q 164 33 168 36"/>
  </g>
</svg>
