<svg class="service-art-svg" viewBox="0 0 340 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional implementation coordination illustration showing project milestones and technical partner management">
  <defs>
    <!-- Cyan coordination grid -->
    <pattern id="c3-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#174d3b" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
    <filter id="c3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#174d3b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cyan Canvas Base -->
  <rect width="100%" height="100%" rx="12" fill="#9ee0eb"/>
  <rect width="100%" height="100%" rx="12" fill="url(#c3-grid)"/>

  <!-- Top Status Pill (Centered, Clean) -->
  <g transform="translate(90, 14)">
    <rect x="0" y="0" width="160" height="18" rx="9" fill="#174d3b"/>
    <circle cx="10" cy="9" r="3.5" fill="#84cc16"/>
    <text x="88" y="12.5" fill="#f5f6e9" font-family="'DM Sans',sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="0.6">STRATEGY → DELIVERY</text>
  </g>

  <!-- ================= ARCHITECTURAL SITE PLAN FOUNDATION ================= -->
  <!-- Floorplate & Site Plan Outline at Base -->
  <g stroke="#174d3b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <polygon points="45,120 165,74 295,114 175,154" fill="#b8edf5"/>
    <!-- Building core grid -->
    <polygon points="85,116 165,86 240,110 160,140" fill="none" stroke-dasharray="3 2"/>
    <line x1="125" y1="101" x2="200" y2="126"/>
    <line x1="125" y1="128" x2="200" y2="98"/>
    <!-- Corner Nodes -->
    <circle cx="85" cy="116" r="2.5" fill="#174d3b"/>
    <circle cx="165" cy="86" r="2.5" fill="#174d3b"/>
    <circle cx="240" cy="110" r="2.5" fill="#174d3b"/>
    <circle cx="160" cy="140" r="2.5" fill="#174d3b"/>
  </g>

  <!-- ================= THREE CLEARLY SPACED MILESTONES ================= -->
  <!-- Main Transition Timeline Track -->
  <line x1="40" y1="56" x2="300" y2="56" stroke="#174d3b" stroke-width="3" stroke-linecap="round"/>
  <!-- Highlight track pulse -->
  <line x1="40" y1="56" x2="300" y2="56" stroke="#84cc16" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round"/>

  <!-- Vertical Coordination Links connecting timeline down to building foundation -->
  <path d="M 65 70 V 94 L 85 116" fill="none" stroke="#174d3b" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M 170 70 V 80 L 165 86" fill="none" stroke="#174d3b" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M 275 70 V 96 L 240 110" fill="none" stroke="#174d3b" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- MILESTONE 1: TECHNICAL SPECS (x = 65) -->
  <g transform="translate(65, 56)" filter="url(#c3-shadow)">
    <!-- Milestone Diamond -->
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#174d3b"/>
    <text x="0" y="3.5" fill="#c7f36a" font-family="'DM Sans',sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">M1</text>
    <!-- Label Pill Below -->
    <rect x="-38" y="19" width="76" height="18" rx="4" fill="#ffffff" stroke="#174d3b" stroke-width="1.2"/>
    <text x="0" y="31.5" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="7" font-weight="800" text-anchor="middle">TECH SPECS</text>
  </g>

  <!-- MILESTONE 2: PARTNER VETTING (x = 170) -->
  <g transform="translate(170, 56)" filter="url(#c3-shadow)">
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#174d3b"/>
    <text x="0" y="3.5" fill="#c7f36a" font-family="'DM Sans',sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">M2</text>
    <!-- Label Pill Below -->
    <rect x="-42" y="19" width="84" height="18" rx="4" fill="#ffffff" stroke="#174d3b" stroke-width="1.2"/>
    <text x="0" y="31.5" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="7" font-weight="800" text-anchor="middle">PARTNER VETTING</text>
  </g>

  <!-- MILESTONE 3: DELIVERY QA (x = 275) -->
  <g transform="translate(275, 56)" filter="url(#c3-shadow)">
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#174d3b"/>
    <text x="0" y="3.5" fill="#c7f36a" font-family="'DM Sans',sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">M3</text>
    <!-- Label Pill Below -->
    <rect x="-38" y="19" width="76" height="18" rx="4" fill="#ffffff" stroke="#174d3b" stroke-width="1.2"/>
    <text x="0" y="31.5" fill="#174d3b" font-family="'DM Sans',sans-serif" font-size="7" font-weight="800" text-anchor="middle">DELIVERY QA</text>
  </g>

  <!-- Bottom Quality Verification Chip -->
  <g transform="translate(95, 138)">
    <rect x="0" y="0" width="150" height="17" rx="4" fill="#174d3b" filter="url(#c3-shadow)"/>
    <circle cx="10" cy="8.5" r="3" fill="#84cc16"/>
    <text x="80" y="12" fill="#f7f6ed" font-family="'DM Sans',sans-serif" font-size="6.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">ALIGNMENT VERIFIED ✓</text>
  </g>
</svg>